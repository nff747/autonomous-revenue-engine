name: Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Master Orchestrator
        run: |
          python3 master_orchestrator.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data_feeds/*.csv bounty_scanner/*.json checkout_watchdog/*.json
          git commit -m "Auto-update 24/7 revenue feeds & reports [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
